name: Crear APK Pulpix 2

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir Pulpix 2
        run: unzip -o Pulpix2_proyecto_inicial.zip

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Crear APK
        run: gradle -p Pulpix2/app assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulpix2-APK
          path: Pulpix2/app/build/outputs/apk/debug/app-debug.apk
